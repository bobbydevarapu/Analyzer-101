services:
  - type: web
    name: assignment-integrity-analyzer
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: TESSERACT_CMD
        sync: false